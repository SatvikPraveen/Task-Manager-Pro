# 📦 Project Metadata
[project]
name = "task-manager-pro"  # Name of the package
version = "0.3.0"  # Updated version with REST API
description = "Advanced task manager with REST API, database, security, and email reminders"  # Short project summary
authors = [{ name = "Satvik Praveen" }]  # List of authors
readme = "README.md"  # Markdown file used as long description on PyPI
requires-python = ">=3.10"  # Minimum required Python version

# 📚 Dependencies required to run the project
dependencies = [
    "python-dotenv>=1.2,<2.0",  # For loading environment variables from .env
    "typing-extensions>=4.9,<5.0",  # For backward-compatible typing features
    "pydantic>=2.5,<3.0",  # Data validation using type hints
    "pydantic-settings>=2.0,<3.0",  # Pydantic settings management
    "email-validator>=2.0,<3.0",  # Required for pydantic's EmailStr type
    "rich>=13.0,<16.0",  # For pretty-printing and enhanced terminal outputs
    "sqlalchemy>=2.0,<3.0",  # SQL toolkit and ORM
    "alembic>=1.13,<2.0",  # Database migration tool
    "bcrypt>=4.0,<6.0",  # Password hashing library
    "pyjwt>=2.8,<3.0",  # JSON Web Token library
    "fastapi>=0.100,<1.0",  # Modern web framework for REST API
    "uvicorn[standard]>=0.23,<1.0",  # ASGI server for FastAPI
    "prometheus-client>=0.20,<1.0",  # /metrics exposition
]

# 🧪 Optional dependency groups
[project.optional-dependencies]
test = [
    "pytest>=8.0,<10.0",  # Testing framework
    "pytest-cov>=5.0,<8.0",  # Coverage reporting for pytest
    "pytest-asyncio>=0.23,<2.0",  # Async test support for pytest
    "httpx>=0.27,<1.0",  # HTTP client for testing
]

# 🚀 CLI entry point definition
[project.scripts]
task-manager = "task_manager_pro.cli:main"  # Allows running `task-manager` from terminal

# 🔧 Build system configuration (PEP 517)
[build-system]
requires = ["setuptools>=61.0"]  # Build tool requirement
build-backend = "setuptools.build_meta"  # Backend to build the project

# 📁 Tells setuptools where to find the source code
[tool.setuptools]
packages = ["task_manager_pro"]  # Main package directory to include