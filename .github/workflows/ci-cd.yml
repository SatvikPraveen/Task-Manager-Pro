name: CI/CD Pipeline

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # Test-only secret. Never use this value outside CI — production
  # deployments must set a real SECRET_KEY (see .env.template).
  SECRET_KEY: test-only-secret-key-not-for-production-use
  BCRYPT_ROUNDS: "4"
  RATE_LIMIT_ENABLED: "false"
  PIP_DISABLE_PIP_VERSION_CHECK: "1"

jobs:
  lint:
    name: Lint, format, types, security
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install
        run: pip install -e ".[dev]"
      - name: Ruff (lint)
        run: ruff check . --output-format github
      - name: Ruff (format)
        run: ruff format --check .
      - name: mypy
        run: mypy
      - name: Bandit (fails on medium/high severity)
        run: bandit -c pyproject.toml -r task_manager_pro -ll
      - name: Migration drift check (models ⇔ alembic history)
        env:
          DATABASE_URL: sqlite:///./ci-migrations.db
        run: |
          alembic upgrade head
          alembic check

  test:
    name: Tests (py${{ matrix.python-version }}, ${{ matrix.database }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
        database: [sqlite]
        include:
          - python-version: "3.12"
            database: postgres
    services:
      postgres:
        image: ${{ matrix.database == 'postgres' && 'postgres:16-alpine' || '' }}
        env:
          POSTGRES_USER: taskmanager
          POSTGRES_PASSWORD: taskmanager
          POSTGRES_DB: taskmanager
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U taskmanager"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
      redis:
        image: ${{ matrix.database == 'postgres' && 'redis:7-alpine' || '' }}
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install
        run: pip install -e ".[test,postgres,redis]"
      - name: Point tests at PostgreSQL and Redis
        if: matrix.database == 'postgres'
        run: |
          echo "DATABASE_URL=postgresql+psycopg://taskmanager:taskmanager@localhost:5432/taskmanager" >> "$GITHUB_ENV"
          echo "REDIS_URL=redis://localhost:6379/0" >> "$GITHUB_ENV"
      - name: Apply migrations (PostgreSQL)
        if: matrix.database == 'postgres'
        run: alembic upgrade head
      - name: Run tests with coverage gate
        run: pytest --cov --cov-report=xml --cov-report=term-missing
      - name: Upload coverage to Codecov
        if: matrix.python-version == '3.12' && matrix.database == 'sqlite'
        uses: codecov/codecov-action@v7
        with:
          files: ./coverage.xml
          flags: unittests
          fail_ci_if_error: false

  audit:
    name: Dependency vulnerability audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: pip install -e ".[dev,postgres]"
      - name: pip-audit
        run: pip-audit --desc on --skip-editable  # exits non-zero on any vulnerability; --strict would also fail on the editable self-install

  build:
    name: Build distribution
    needs: [lint, test]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build sdist + wheel
        run: |
          pip install build twine
          python -m build
          twine check dist/*
      - uses: actions/upload-artifact@v4
        with:
          name: distribution-packages
          path: dist/

  docker:
    name: Docker image
    needs: [lint, test]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build
        uses: docker/build-push-action@v6
        with:
          context: .
          file: dockerfile
          push: false
          load: true
          tags: task-manager-pro:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Smoke test the image
        run: |
          docker run -d --name tmp -p 8000:8000 \
            -e SECRET_KEY="$SECRET_KEY" -e DATABASE_URL=sqlite:////app/data/tasks.db \
            task-manager-pro:ci
          for i in $(seq 1 30); do
            if curl -fsS http://localhost:8000/health; then echo; break; fi
            sleep 1
          done
          curl -fsS http://localhost:8000/health | grep -q '"database":"ok"'
          curl -fsS http://localhost:8000/metrics | grep -q http_requests_total
          docker logs tmp | tail -20
          docker rm -f tmp
